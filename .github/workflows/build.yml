name: Build

on:
  push:
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - 'CNAME'
      - '.claude/**'
      - '.gitignore'
      - 'blog/**'
      - 'llmdoc/**'
      - 'icon.svg'
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '**/*.md'
      - 'CNAME'
      - '.claude/**'
      - '.gitignore'
      - 'blog/**'
      - 'llmdoc/**'
      - 'icon.svg'

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      tweaks: ${{ steps.find.outputs.tweaks }}
    steps:
      - uses: actions/checkout@v5
      - name: Find tweak directories
        id: find
        run: |
          # Find directories containing both Makefile and control (Theos tweaks)
          TWEAKS=$(find . -maxdepth 2 -name "control" -path "*/control" | while read f; do
            dir=$(dirname "$f")
            if [ -f "$dir/Makefile" ]; then
              basename "$dir"
            fi
          done | jq -R -s -c 'split("\n") | map(select(. != ""))')
          echo "tweaks=$TWEAKS" >> $GITHUB_OUTPUT
          echo "Found tweaks: $TWEAKS"

  build:
    needs: discover
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        tweak: ${{ fromJson(needs.discover.outputs.tweaks) }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Theos
        run: |
          brew install ldid dpkg
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          # macOS runner 上 Xcode 自带的 iOS SDK 不含私有框架 stub（Preferences、
          # FrontBoardServices 等），链接依赖私有框架的 target 会报 'framework not found'。
          # 从 theos/sdks 拉取带私有框架 stub 的 patched SDK（只取一个版本以省时）。
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/theos-sdks
          git -C /tmp/theos-sdks sparse-checkout set iPhoneOS16.5.sdk
          cp -r /tmp/theos-sdks/iPhoneOS16.5.sdk $HOME/theos/sdks/

      - name: Build ${{ matrix.tweak }}
        working-directory: ${{ matrix.tweak }}
        run: |
          make clean
          make FINALPACKAGE=1
          make package FINALPACKAGE=1

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.tweak }}-deb
          path: ${{ matrix.tweak }}/packages/*.deb

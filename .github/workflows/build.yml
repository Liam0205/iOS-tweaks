name: Build

on:
  push:
    branches: [master]
    paths-ignore:
      - '*.md'
      - 'CNAME'
      - '.claude/**'
      - '.gitignore'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'llmdoc/**'
      - 'icon.svg'
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '*.md'
      - 'CNAME'
      - '.claude/**'
      - '.gitignore'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'llmdoc/**'
      - 'icon.svg'

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      tweaks: ${{ steps.find.outputs.tweaks }}
    steps:
      - uses: actions/checkout@v4
      - name: Find tweak directories
        id: find
        run: |
          # Find directories containing both Makefile and control (Theos tweaks)
          TWEAKS=$(find . -maxdepth 2 -name "control" -path "*/control" | while read f; do
            dir=$(dirname "$f")
            if [ -f "$dir/Makefile" ]; then
              basename "$dir"
            fi
          done | jq -R -s -c 'split("\n") | map(select(. != ""))')
          echo "tweaks=$TWEAKS" >> $GITHUB_OUTPUT
          echo "Found tweaks: $TWEAKS"

  build:
    needs: discover
    runs-on: macos-latest
    strategy:
      matrix:
        tweak: ${{ fromJson(needs.discover.outputs.tweaks) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        run: |
          brew install ldid dpkg
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Build ${{ matrix.tweak }}
        working-directory: ${{ matrix.tweak }}
        run: |
          make clean
          make FINALPACKAGE=1
          make package FINALPACKAGE=1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.tweak }}-deb
          path: ${{ matrix.tweak }}/packages/*.deb

name: Release

on:
  push:
    tags:
      - 'mybankbypass_[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: meta
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#mybankbypass_}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Wait for build workflow
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: build
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 15

      - name: Download artifact from build workflow
        run: |
          mkdir -p dist
          RUN_ID=$(gh run list --workflow=build.yml --commit=${{ github.sha }} --status=success --json databaseId -q '.[0].databaseId')
          if [ -z "$RUN_ID" ]; then
            echo "::error::No successful build found for this commit"
            exit 1
          fi
          gh run download "$RUN_ID" -n mybankbypass-deb -D dist/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate release notes
        id: notes
        run: |
          PREV_TAG=$(git tag --sort=-creatordate | grep '^mybankbypass_' | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="${PREV_TAG}..HEAD"
          fi
          NOTES=$(git log "$RANGE" --pretty=format:"- %s" -- mybankbypass/)
          if [ -z "$NOTES" ]; then
            NOTES="- Release ${{ steps.meta.outputs.version }}"
          fi
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: MYBankBypass v${{ steps.meta.outputs.version }}
          body: ${{ steps.notes.outputs.notes }}
          prerelease: true
          files: dist/*.deb

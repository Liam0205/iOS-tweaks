name: Release

on:
  push:
    tags:
      - '*_[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    runs-on: macos-latest
    concurrency:
      group: release-deploy
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse tag
        id: meta
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          TWEAK="${TAG%_*}"
          VERSION="${TAG##*_}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "tweak=$TWEAK" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          if [ -f "$TWEAK/control" ]; then
            NAME=$(grep '^Name:' "$TWEAK/control" | cut -d: -f2- | xargs)
          else
            NAME="$TWEAK"
          fi
          echo "name=$NAME" >> $GITHUB_OUTPUT

      - name: Install Theos
        run: |
          brew install ldid dpkg librsvg
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Build
        working-directory: ${{ steps.meta.outputs.tweak }}
        run: |
          make clean
          make package FINALPACKAGE=1

      - name: Prepare deb
        run: |
          mkdir -p dist
          cp ${{ steps.meta.outputs.tweak }}/packages/*.deb dist/

      - name: Generate release notes
        id: notes
        run: |
          TWEAK="${{ steps.meta.outputs.tweak }}"
          TAG="${{ steps.meta.outputs.tag }}"
          PREV_TAG=$(git tag --sort=-creatordate | grep "^${TWEAK}_" | grep -v "^${TAG}$" | head -1)
          if [ -z "$PREV_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="${PREV_TAG}..HEAD"
          fi
          NOTES=$(git log "$RANGE" --pretty=format:"- %s" -- "$TWEAK/")
          if [ -z "$NOTES" ]; then
            NOTES="- Release ${{ steps.meta.outputs.version }}"
          fi
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "${{ steps.meta.outputs.name }} v${{ steps.meta.outputs.version }}"
          body: ${{ steps.notes.outputs.notes }}
          prerelease: false
          files: dist/*.deb

      - name: Fetch repo from gh-pages
        run: |
          git fetch origin gh-pages:gh-pages
          git worktree add /tmp/gh-pages gh-pages
          rm -rf repo
          cp -r /tmp/gh-pages repo
          rm -rf repo/.git
          git worktree remove /tmp/gh-pages

      - name: Update Sileo repo
        run: |
          TWEAK="${{ steps.meta.outputs.tweak }}"
          PKG_ID=$(grep '^Package:' "$TWEAK/control" | cut -d: -f2- | xargs)
          OLD_PKG=$(grep '^Conflicts:' "$TWEAK/control" | cut -d: -f2- | xargs)

          rm -f repo/debs/${PKG_ID}_*.deb
          [ -n "$OLD_PKG" ] && rm -f repo/debs/${OLD_PKG}_*.deb
          cp dist/*.deb repo/debs/

          cd repo
          dpkg-scanpackages debs /dev/null > Packages 2>/dev/null

          # Patch Packages with fields from control files
          cd ..
          for ctrl in */control; do
            pkg=$(grep '^Package:' "$ctrl" | cut -d: -f2- | xargs)
            depiction=$(grep '^SileoDepiction:' "$ctrl" | cut -d: -f2- | xargs)
            section=$(grep '^Section:' "$ctrl" | cut -d: -f2- | xargs)
            if [ -n "$pkg" ]; then
              if [ -n "$section" ]; then
                sed -i '' "/^Package: $pkg/,/^$/{s|^Section:.*|Section: $section|;}" repo/Packages
              fi
              if [ -n "$depiction" ]; then
                sed -i '' "/^Package: $pkg/,/^$/{/^[Ss]ileo[Dd]epiction:/d;}" repo/Packages
                sed -i '' "/^Package: $pkg/,/^$/{s|^Name:.*|&\\"$'\n'"SileoDepiction: $depiction|;}" repo/Packages
              fi
            fi
          done
          cd repo

          gzip -k -f Packages
          bzip2 -k -f Packages

          # Generate Release from scratch
          {
            echo "Origin: 0x01"
            echo "Label: 0x01"
            echo "Suite: stable"
            echo "Version: 1.0"
            echo "Codename: stable"
            echo "Architectures: iphoneos-arm64"
            echo "Components: main"
            echo "Description: 0x01 Jailbreak Tweaks Repository"
            echo "MD5Sum:"
            for f in Packages Packages.gz Packages.bz2; do
              SIZE=$(wc -c < "$f" | tr -d ' ')
              HASH=$(md5 -q "$f")
              printf " %s %s %s\n" "$HASH" "$SIZE" "$f"
            done
            echo "SHA256:"
            for f in Packages Packages.gz Packages.bz2; do
              SIZE=$(wc -c < "$f" | tr -d ' ')
              HASH=$(shasum -a 256 "$f" | cut -d' ' -f1)
              printf " %s %s %s\n" "$HASH" "$SIZE" "$f"
            done
          } > Release

      - name: Update depiction
        run: |
          TWEAK="${{ steps.meta.outputs.tweak }}"
          PKG_ID=$(grep '^Package:' "$TWEAK/control" | cut -d: -f2- | xargs)
          OLD_PKG=$(grep '^Conflicts:' "$TWEAK/control" | cut -d: -f2- | xargs)
          DESC=$(grep '^Description:' "$TWEAK/control" | cut -d: -f2- | xargs)
          CHANGELOG_FILE="$TWEAK/CHANGELOG.md"

          mkdir -p repo/depictions
          [ -n "$OLD_PKG" ] && rm -f "repo/depictions/${OLD_PKG}.json"

          if [ -f "$CHANGELOG_FILE" ]; then
            CHANGELOG=$(sed '1{/^# /d;}' "$CHANGELOG_FILE")
          else
            CHANGELOG="## ${{ steps.meta.outputs.version }}\n\nRelease ${{ steps.meta.outputs.version }}"
          fi

          DESC_JSON=$(printf '%s' "$DESC" | python3 -c 'import sys,json; print(json.dumps(sys.stdin.read()))')
          CL_JSON=$(printf '%s' "$CHANGELOG" | python3 -c 'import sys,json; print(json.dumps(sys.stdin.read()))')

          cat > "repo/depictions/${PKG_ID}.json" <<DEPICTION
          {
            "minVersion": "0.1",
            "headerImage": "",
            "tintColor": "#2196F3",
            "tabs": [
              {
                "tabname": "详情",
                "views": [{"class": "DepictionMarkdownView", "markdown": $DESC_JSON}],
                "class": "DepictionStackView"
              },
              {
                "tabname": "更新日志",
                "views": [{"class": "DepictionMarkdownView", "markdown": $CL_JSON}],
                "class": "DepictionStackView"
              }
            ],
            "class": "DepictionTabView"
          }
          DEPICTION
          sed -i '' 's/^          //' "repo/depictions/${PKG_ID}.json"

      - name: Generate index.html
        run: |
          ITEMS=""
          for ctrl in */control; do
            name=$(grep '^Name:' "$ctrl" | cut -d: -f2- | xargs)
            desc=$(grep '^Description:' "$ctrl" | cut -d: -f2- | xargs)
            version=$(grep '^Version:' "$ctrl" | cut -d: -f2- | xargs)
            [ -z "$name" ] && continue
            ITEMS="${ITEMS}<li><strong>${name}</strong> <small>v${version}</small><br><span class=\"desc\">${desc}</span></li>"
          done
          cat > repo/index.html <<'INDEXEOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>0x01 Tweaks</title>
            <link rel="icon" type="image/svg+xml" href="icon.svg">
            <style>
              body { font-family: -apple-system, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
              h1 { font-size: 1.5em; }
              code { background: #f0f0f0; padding: 2px 6px; border-radius: 4px; }
              .add-btn { display: inline-block; margin-top: 16px; padding: 12px 24px; background: #007aff; color: #fff; text-decoration: none; border-radius: 8px; }
              .desc { color: #666; font-size: 0.9em; }
              li { margin-bottom: 12px; }
            </style>
          </head>
          <body>
            <h1>0x01 Tweaks</h1>
            <p>适用于 rootless 越狱 (Dopamine / palera1n) 的插件仓库。</p>
            <h2>可用插件</h2>
            <ul>
          INDEXEOF
          echo "$ITEMS" >> repo/index.html
          cat >> repo/index.html <<'INDEXEOF'
            </ul>
            <h2>添加软件源</h2>
            <p>在 Sileo 中添加以下地址：</p>
            <p><code>https://tweaks.0x01.page/</code></p>
            <a class="add-btn" href="sileo://source/https://tweaks.0x01.page/">添加到 Sileo</a>
          </body>
          </html>
          INDEXEOF
          sed -i '' 's/^          //' repo/index.html

      - name: Generate icons
        run: |
          cp icon.svg repo/icon.svg
          rsvg-convert -w 512 -h 512 icon.svg -o repo/CydiaIcon.png

      - name: Deploy to gh-pages
        run: |
          cp -r repo /tmp/pages-content
          git checkout --orphan gh-pages-tmp
          git rm -rf .
          git clean -fdx
          cp -r /tmp/pages-content/* .
          git add -A
          git commit -m "Deploy: ${{ steps.meta.outputs.tweak }} ${{ steps.meta.outputs.version }}"
          git push origin gh-pages-tmp:gh-pages --force

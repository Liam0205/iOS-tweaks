name: Release

on:
  push:
    tags:
      - '*_[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse tag
        id: meta
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # Tag format: <tweak-dir>_<version>
          TWEAK="${TAG%_*}"
          VERSION="${TAG##*_}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "tweak=$TWEAK" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # Read display name from control file
          if [ -f "$TWEAK/control" ]; then
            NAME=$(grep '^Name:' "$TWEAK/control" | cut -d: -f2- | xargs)
          else
            NAME="$TWEAK"
          fi
          echo "name=$NAME" >> $GITHUB_OUTPUT

      - name: Wait for build workflow
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: build (${{ steps.meta.outputs.tweak }})
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 15

      - name: Download artifact
        run: |
          mkdir -p dist
          RUN_ID=$(gh run list --workflow=build.yml --commit=${{ github.sha }} --status=success --json databaseId -q '.[0].databaseId')
          if [ -z "$RUN_ID" ]; then
            echo "::error::No successful build found for this commit"
            exit 1
          fi
          gh run download "$RUN_ID" -n "${{ steps.meta.outputs.tweak }}-deb" -D dist/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate release notes
        id: notes
        run: |
          TWEAK="${{ steps.meta.outputs.tweak }}"
          TAG="${{ steps.meta.outputs.tag }}"
          # Find previous tag for same tweak
          PREV_TAG=$(git tag --sort=-creatordate | grep "^${TWEAK}_" | grep -v "^${TAG}$" | head -1)
          if [ -z "$PREV_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="${PREV_TAG}..HEAD"
          fi
          NOTES=$(git log "$RANGE" --pretty=format:"- %s" -- "$TWEAK/")
          if [ -z "$NOTES" ]; then
            NOTES="- Release ${{ steps.meta.outputs.version }}"
          fi
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "${{ steps.meta.outputs.name }} v${{ steps.meta.outputs.version }}"
          body: ${{ steps.notes.outputs.notes }}
          prerelease: false
          files: dist/*.deb

      - name: Update Sileo repo
        run: |
          # Read package ID from control
          TWEAK="${{ steps.meta.outputs.tweak }}"
          PKG_ID=$(grep '^Package:' "$TWEAK/control" | cut -d: -f2- | xargs)

          # Remove old debs for this package, add new
          rm -f repo/debs/${PKG_ID}_*.deb
          cp dist/*.deb repo/debs/

          # Regenerate Packages from ALL debs in repo
          cd repo
          dpkg-scanpackages debs /dev/null > Packages 2>/dev/null

          # Patch Packages with fields from each tweak's control (SileoDepiction, Section)
          cd ..
          for ctrl in */control; do
            pkg=$(grep '^Package:' "$ctrl" | cut -d: -f2- | xargs)
            depiction=$(grep '^SileoDepiction:' "$ctrl" | cut -d: -f2- | xargs)
            section=$(grep '^Section:' "$ctrl" | cut -d: -f2- | xargs)
            if [ -n "$pkg" ]; then
              if [ -n "$section" ]; then
                sed -i "/^Package: $pkg/,/^$/{s|^Section:.*|Section: $section|}" repo/Packages
              fi
              if [ -n "$depiction" ]; then
                # Remove any existing depiction lines (case-insensitive), then add correct one
                sed -i "/^Package: $pkg/,/^$/{/^[Ss]ileo[Dd]epiction:/d}" repo/Packages
                sed -i "/^Package: $pkg/,/^$/s|^Name:.*|&\nSileoDepiction: $depiction|" repo/Packages
              fi
            fi
          done
          cd repo

          gzip -k -f Packages
          bzip2 -k -f Packages

          # Regenerate Release with checksums
          {
            grep -v '^MD5Sum:\|^SHA256:\|^ ' Release 2>/dev/null || true
            echo "MD5Sum:"
            for f in Packages Packages.gz Packages.bz2; do
              SIZE=$(wc -c < "$f" | tr -d ' ')
              HASH=$(md5sum "$f" | cut -d' ' -f1)
              echo " $HASH $SIZE $f"
            done
            echo "SHA256:"
            for f in Packages Packages.gz Packages.bz2; do
              SIZE=$(wc -c < "$f" | tr -d ' ')
              HASH=$(sha256sum "$f" | cut -d' ' -f1)
              echo " $HASH $SIZE $f"
            done
          } > Release.tmp && mv Release.tmp Release

      - name: Update depiction
        run: |
          TWEAK="${{ steps.meta.outputs.tweak }}"
          PKG_ID=$(grep '^Package:' "$TWEAK/control" | cut -d: -f2- | xargs)
          DESC=$(grep '^Description:' "$TWEAK/control" | cut -d: -f2- | xargs)
          CHANGELOG_FILE="$TWEAK/CHANGELOG.md"

          mkdir -p repo/depictions

          # Read changelog content (strip leading "# Changelog" header)
          if [ -f "$CHANGELOG_FILE" ]; then
            CHANGELOG=$(sed '1{/^# /d;}' "$CHANGELOG_FILE")
          else
            CHANGELOG="## ${{ steps.meta.outputs.version }}\n\nRelease ${{ steps.meta.outputs.version }}"
          fi

          # Escape for JSON
          DESC_JSON=$(printf '%s' "$DESC" | python3 -c 'import sys,json; print(json.dumps(sys.stdin.read()))')
          CL_JSON=$(printf '%s' "$CHANGELOG" | python3 -c 'import sys,json; print(json.dumps(sys.stdin.read()))')

          cat > "repo/depictions/${PKG_ID}.json" <<DEPICTION
          {
            "minVersion": "0.1",
            "headerImage": "",
            "tintColor": "#2196F3",
            "tabs": [
              {
                "tabname": "详情",
                "views": [{"class": "DepictionMarkdownView", "markdown": $DESC_JSON}],
                "class": "DepictionStackView"
              },
              {
                "tabname": "更新日志",
                "views": [{"class": "DepictionMarkdownView", "markdown": $CL_JSON}],
                "class": "DepictionStackView"
              }
            ],
            "class": "DepictionTabView"
          }
          DEPICTION

      - name: Commit and push to master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add repo/
          git commit -m "repo: update ${{ steps.meta.outputs.tweak }} to ${{ steps.meta.outputs.version }}" || true
          git push origin HEAD:master

      - name: Deploy to gh-pages
        run: |
          git checkout --orphan gh-pages-tmp
          git rm -rf .
          cp -r repo/* .
          cp -r repo/.* . 2>/dev/null || true
          git add -A
          git commit -m "Deploy: ${{ steps.meta.outputs.tweak }} ${{ steps.meta.outputs.version }}"
          git push origin gh-pages-tmp:gh-pages --force
